name: Actualizar leyes

on:
  schedule:
    - cron: '17 13 * * *'   # todos los días, 7:17 a.m. hora del centro de México
  workflow_dispatch:         # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar herramientas
        run: pip install pymupdf pillow
      - name: Revisar la Cámara de Diputados y convertir reformas
        run: python _herramientas/actualizar.py
      - name: Guardar cambios
        run: |
          git config user.name "xerova-bot"
          git config user.email "xerova-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización automática de leyes $(date +%F)"
            git push
          fi
